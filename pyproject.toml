[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-los"
version = "0.1.0"
description = "Local video tracking and auditable traffic data extraction for CE5221"
requires-python = ">=3.10,<3.14"
dependencies = ["ultralytics==8.3.228", "opencv-python==4.12.0.88", "numpy==2.2.6", "lap==0.5.12"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
traffic-los = "traffic_los.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
traffic_los = ["annotation.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
